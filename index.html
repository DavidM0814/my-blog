<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="배우고 생각한 것을 기록합니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fa8'/%3E%3Cpath d='M8 23V9h2.5l5.5 8 5.5-8H24v14h-3V14l-5 7-5-7v9z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    // 첫 화면이 그려지기 전에 저장된 테마를 적용한다.
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="#/">My Blog</a>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </header>
  <main id="app" class="content" tabindex="-1"></main>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
